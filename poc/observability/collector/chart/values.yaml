# --- GLOBAL VARIABLES ---
# Replace this with your actual WFM Host IP/DNS via --set global.wfmHost=...
global:
  wfmHost: "127.0.0.1"

# --- Promtail Configuration ---
promtail:
  config:
    clients:
      - url: http://{{ .Values.global.wfmHost }}:32100/loki/api/v1/push
    scrape_configs:
      - job_name: pod-logs
        static_configs:
          - targets: [ localhost ]
            labels:
              job: podlogs
              __path__: /var/log/pods/*/*/*.log

# --- OTEL Collector Configuration ---
opentelemetry-collector:
  mode: deployment
  image:
    repository: otel/opentelemetry-collector-contrib

  config:
    receivers:
      otlp:
        protocols:
          http: { endpoint: "0.0.0.0:4318" }
          grpc: { endpoint: "0.0.0.0:4317" }
      hostmetrics:
        collection_interval: 30s
        scrapers:
          cpu: {}
          memory: {}
          disk: {}
          network: {}
      kubeletstats:
        collection_interval: 30s
        auth_type: "serviceAccount"
        endpoint: "https://${env:KUBE_NODE_NAME}:10250"
        insecure_skip_verify: true

    exporters:
      # Matches script: Traces to Jaeger
      otlp:
        endpoint: "{{ .Values.global.wfmHost }}:30417"
        tls: { insecure: true }

      # Matches script: Metrics to Prometheus Remote Write
      prometheusremotewrite:
        endpoint: "http://{{ .Values.global.wfmHost }}:30909/api/v1/write"
        tls: { insecure: true }
        resource_to_telemetry_conversion: { enabled: true }

    service:
      pipelines:
        traces:
          receivers: [ otlp ]
          exporters: [ otlp ]
        metrics:
          receivers: [ otlp, hostmetrics, kubeletstats ]
          exporters: [ prometheusremotewrite ]
